<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Abstract enterprise data network visual</title>
  <desc id="desc">Blue and cyan abstract network lines and nodes on a dark gradient background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06152f"/>
      <stop offset="55%" stop-color="#0b2b59"/>
      <stop offset="100%" stop-color="#0f4f8a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fd5ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#5ce1e6" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee7ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6ee7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g opacity="0.35">
    <circle cx="200" cy="130" r="260" fill="url(#glow)"/>
    <circle cx="1280" cy="760" r="280" fill="url(#glow)"/>
    <circle cx="870" cy="290" r="220" fill="url(#glow)"/>
  </g>

  <g stroke="url(#line)" stroke-width="2.2" fill="none">
    <path d="M120 740 L320 620 L520 680 L760 510 L960 590 L1220 430 L1460 540"/>
    <path d="M90 480 L290 360 L470 420 L660 250 L910 320 L1110 210 L1470 300"/>
    <path d="M180 210 L370 260 L640 140 L860 190 L1080 120 L1310 190 L1510 110"/>
    <path d="M210 820 L440 760 L690 820 L930 740 L1160 810 L1430 720"/>
    <path d="M280 120 L290 360 L320 620 L440 760"/>
    <path d="M760 510 L660 250 L640 140"/>
    <path d="M960 590 L910 320 L860 190"/>
    <path d="M1220 430 L1110 210 L1080 120"/>
  </g>

  <g fill="#87e9ff" opacity="0.95" filter="url(#softBlur)">
    <circle cx="120" cy="740" r="7"/>
    <circle cx="320" cy="620" r="8"/>
    <circle cx="520" cy="680" r="9"/>
    <circle cx="760" cy="510" r="10"/>
    <circle cx="960" cy="590" r="8"/>
    <circle cx="1220" cy="430" r="9"/>
    <circle cx="1460" cy="540" r="7"/>

    <circle cx="90" cy="480" r="7"/>
    <circle cx="290" cy="360" r="8"/>
    <circle cx="470" cy="420" r="7"/>
    <circle cx="660" cy="250" r="10"/>
    <circle cx="910" cy="320" r="8"/>
    <circle cx="1110" cy="210" r="8"/>
    <circle cx="1470" cy="300" r="7"/>

    <circle cx="180" cy="210" r="7"/>
    <circle cx="370" cy="260" r="8"/>
    <circle cx="640" cy="140" r="9"/>
    <circle cx="860" cy="190" r="8"/>
    <circle cx="1080" cy="120" r="8"/>
    <circle cx="1310" cy="190" r="7"/>
    <circle cx="1510" cy="110" r="7"/>
  </g>
</svg>
