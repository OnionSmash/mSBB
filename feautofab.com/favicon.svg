  <!-- Engine Block/Gear Icon -->
  <g transform="translate(50, 50)">
    <!-- Main Gear -->
    <path d="M 0,-28 L 6,-28 L 9,-23 L 14,-25 L 17,-20 L 23,-22 L 25,-16 L 28,-16 L 28,-11 L 33,-9 L 31,-4 L 35,0 L 31,4 L 33,9 L 28,11 L 28,16 L 25,16 L 23,22 L 17,20 L 14,25 L 9,23 L 6,28 L 0,28 L -6,28 L -9,23 L -14,25 L -17,20 L -23,22 L -25,16 L -28,16 L -28,11 L -33,9 L -31,4 L -35,0 L -31,-4 L -33,-9 L -28,-11 L -28,-16 L -25,-16 L -23,-22 L -17,-20 L -14,-25 L -9,-23 L -6,-28 Z" fill="#dc3545" stroke="#000" stroke-width="1"/>
    
    <!-- Center Hub -->
