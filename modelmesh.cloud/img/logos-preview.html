  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #060d1f;
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      padding: 48px 40px;
      color: #aac4e0;
    }

    h1 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #3a6090;
      margin-bottom: 40px;
      padding-bottom: 12px;
      border-bottom: 1px solid #0e1e3a;
    }

    section { margin-bottom: 56px; }

    .section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      color: #2a5080;
      margin-bottom: 14px;
    }

    /* ── NAV BAR BASE ── */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      height: 60px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .nav-left  { display: flex; align-items: center; gap: 36px; }
    .nav-links { display: flex; gap: 22px; }
    .nav-links a {
      font-size: 13px;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s;
    }
    .nav-right { display: flex; align-items: center; gap: 10px; }

    .btn {
      border: none;
      padding: 7px 18px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.3px;
    }

    /* ── DARK VARIANT ── */
    .navbar-dark {
      background: #0c1428;
      border: 1px solid #172a4d;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .navbar-dark .nav-links a { color: #5577aa; }
    .navbar-dark .nav-links a:hover { color: #00cfff; }
    .navbar-dark .btn-ghost {
      background: transparent;
      color: #5577aa;
      border: 1px solid #1e3a6a;
    }
    .navbar-dark .btn-primary {
      background: linear-gradient(135deg, #0052e0, #00aaff);
      color: white;
      box-shadow: 0 2px 10px rgba(0,100,255,0.35);
    }

    /* ── LIGHT VARIANT ── */
    .navbar-light {
      background: #ffffff;
      border: 1px solid #dce8f5;
      box-shadow: 0 2px 12px rgba(0,20,60,0.08);
    }
    .navbar-light .nav-links a { color: #4466aa; }
    .navbar-light .nav-links a:hover { color: #0055dd; }
    .navbar-light .btn-ghost {
      background: transparent;
      color: #4466aa;
      border: 1px solid #c0d4ee;
    }
    .navbar-light .btn-primary {
      background: linear-gradient(135deg, #0044cc, #0099ee);
      color: white;
      box-shadow: 0 2px 8px rgba(0,80,220,0.25);
    }

    /* ── DEEP DARK VARIANT ── */
    .navbar-deep {
      background: #020810;
      border: 1px solid #0d1f3a;
      box-shadow: 0 4px 30px rgba(0,0,0,0.7);
    }
    .navbar-deep .nav-links a { color: #446688; }
    .navbar-deep .nav-links a:hover { color: #00e5ff; }
    .navbar-deep .btn-ghost {
      background: transparent;
      color: #446688;
      border: 1px solid #0d2040;
    }
    .navbar-deep .btn-primary {
      background: linear-gradient(135deg, #004dcc, #00ccff);
      color: white;
      box-shadow: 0 2px 12px rgba(0,150,255,0.3);
    }

    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, #0e1e36, transparent);
      margin: 52px 0;
    }

    /* standalone SVG display cards */
    .svg-cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .svg-card {
      padding: 20px 28px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
    }
    .svg-card-dark  { background: #0c1428; border: 1px solid #172a4d; }
    .svg-card-light { background: #ffffff;  border: 1px solid #dce8f5; }
