<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 40" width="180" height="40" role="img" aria-label="Stack Lume">
  <defs>
    <linearGradient id="slg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#15ACE1;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1363C6;stop-opacity:1"/>
