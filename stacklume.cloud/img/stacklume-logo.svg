  <rect x="2" y="28" width="28" height="5" rx="2.5" fill="url(#slg)"/>
  <circle cx="16" cy="11" r="5" fill="#15ACE1" opacity="0.9"/>
  <!-- Wordmark -->
  <text x="38" y="28" font-family="Ubuntu,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Stack Lume</text>
